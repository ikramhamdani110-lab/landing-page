<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — TALORA</title>
    <link rel="stylesheet" href="auth.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <header class="auth-topbar">
        <a class="auth-logo" href="index.html">TALORA</a>
        <a class="auth-back" href="index.html"><i class='bx bx-arrow-back'></i> Back to site</a>
    </header>

    <div class="auth-view">
        <div class="auth-card">
            <h1>Create your account</h1>
            <p class="auth-sub">How would you like to begin?</p>
            <div class="signup-choice" id="signupChoice">
                <button type="button" class="choice-card" data-intent="project">
                    <span class="choice-icon"><i class='bx bx-briefcase-alt-2'></i></span>
                    <strong>Start a Project</strong>
                    <small>For clients with a project, idea, or digital need.</small>
                </button>
                <button type="button" class="choice-card" data-intent="talent">
                    <span class="choice-icon"><i class='bx bx-user-check'></i></span>
                    <strong>Join TALORA</strong>
                    <small>For talented people who want to join the ecosystem.</small>
                </button>
            </div>
            <form id="registerForm" autocomplete="off" novalidate>
                <label class="field" id="fName">
                    <span>Full Name</span>
                    <input type="text" id="regName" autocomplete="name">
                    <em class="field-error">Full name is required.</em>
                </label>
                <label class="field" id="fEmail">
                    <span>Email Address</span>
                    <input type="email" id="regEmail" autocomplete="email">
                    <em class="field-error">Please enter a valid email address.</em>
                </label>
                <label class="field" id="fPass">
                    <span>Password</span>
                    <input type="password" id="regPass" autocomplete="new-password">
                    <em class="field-error">Password must be at least 8 characters.</em>
                </label>
                <label class="field" id="fPass2">
                    <span>Confirm Password</span>
                    <input type="password" id="regPass2" autocomplete="new-password">
                    <em class="field-error">Passwords do not match.</em>
                </label>
                <button type="submit" class="btn btn-primary btn-block" id="registerBtn">Create Account</button>
                <div class="form-message" id="regMessage" role="alert"></div>
            </form>
            <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
        </div>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const msg = document.getElementById('regMessage');
        const btn = document.getElementById('registerBtn');
        let signupType = 'talent';
        document.querySelectorAll('#signupChoice .choice-card').forEach(card => {
            card.addEventListener('click', () => {
                document.querySelectorAll('#signupChoice .choice-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                signupType = card.dataset.intent;
            });
        });
        document.querySelector('#signupChoice .choice-card[data-intent="project"]').classList.add('selected');

        function setInvalid(id, bad) { document.getElementById(id).classList.toggle('invalid', bad); }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msg.className = 'form-message';
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value;
            const pass2 = document.getElementById('regPass2').value;

            let ok = true;
            setInvalid('fName', !name); ok = ok && !!name;
            const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            setInvalid('fEmail', !emailOk); ok = ok && emailOk;
            const passOk = pass.length >= 8;
            setInvalid('fPass', !passOk); ok = ok && passOk;
            const matchOk = pass === pass2 && pass2.length > 0;
            setInvalid('fPass2', !matchOk); ok = ok && matchOk;
            if (!ok) return;

            btn.disabled = true; btn.textContent = 'Creating account...';
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName: name, email, password: pass, confirmPassword: pass2, signupType })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok) {
                    msg.className = 'form-message success';
                    msg.textContent = 'Account created successfully. You can now log in.';
                    form.reset();
                    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                } else {
                    msg.className = 'form-message error';
                    msg.textContent = data.error || 'Unable to create account.';
                }
            } catch {
                msg.className = 'form-message error';
                msg.textContent = 'Unable to reach the server. Please try again.';
            } finally {
                btn.disabled = false; btn.textContent = 'Create Account';
            }
        });
    </script>
</body>
</html>
